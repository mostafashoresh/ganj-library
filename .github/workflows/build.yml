name: Build Windows installer

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Locate project (extract zip if present)
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Recurse -Filter "*.zip" -File | Select-Object -First 1
          if ($zip) {
            Write-Host "Extracting $($zip.FullName)"
            Expand-Archive -Path $zip.FullName -DestinationPath extracted -Force
          }
          $cmake = Get-ChildItem -Recurse -Filter "CMakeLists.txt" -File | Select-Object -First 1
          if (-not $cmake) {
            Get-ChildItem -Recurse | Select-Object -First 60 FullName
            Write-Error "CMakeLists.txt not found in the repository"
            exit 1
          }
          Write-Host "Project folder: $($cmake.DirectoryName)"
          "PROJECT_DIR=$($cmake.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          cache: true

      - name: Configure and build
        shell: pwsh
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          cmake --build build --config Release

      - name: Collect files (Qt DLLs + VC++ runtime)
        shell: pwsh
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          New-Item -ItemType Directory -Force deploy | Out-Null
          Copy-Item build/Release/Ganj.exe deploy/
          windeployqt --release --no-translations --no-system-d3d-compiler --no-opengl-sw deploy/Ganj.exe
          if (Test-Path resources/fonts) { Copy-Item resources/fonts deploy/fonts -Recurse }
          Invoke-WebRequest https://aka.ms/vs/17/release/vc_redist.x64.exe -OutFile deploy/vc_redist.x64.exe

      - name: Build installer
        shell: pwsh
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\ganj.iss

      - uses: actions/upload-artifact@v4
        with:
          name: GanjLibrarySetup
          path: ${{ env.PROJECT_DIR }}/dist/GanjLibrarySetup.exe
